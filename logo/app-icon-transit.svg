<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAFBF7"/><stop offset="1" stop-color="#C6F0E9"/>
    </linearGradient>
    <linearGradient id="caseT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C9B7"/><stop offset="1" stop-color="#0E8C84"/>
