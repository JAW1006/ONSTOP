  </defs>

  <rect width="220" height="220" rx="52" fill="url(#tileT)"/>
  <circle cx="110" cy="110" r="92" fill="#FFFFFF" fill-opacity="0.55"/>

  <g transform="translate(110,112) scale(0.92)">
    <!-- transit flight route (dotted arc) -->
    <path d="M-52,30 C-64,-26 -18,-66 40,-72" fill="none" stroke="#0E8C84" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.5 10"/>
    <circle cx="-52" cy="30" r="4" fill="#0E8C84"/>

    <!-- airplane (ascending, coral) -->
