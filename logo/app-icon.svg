<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3B54"/>
      <stop offset="1" stop-color="#0C2233"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C9B7"/>
      <stop offset="1" stop-color="#0E8C84"/>
    </linearGradient>
  </defs>

  <rect width="220" height="220" rx="52" fill="url(#tile)"/>
  <circle cx="110" cy="108" r="92" fill="#FFFFFF" fill-opacity="0.10"/>

  <g transform="translate(110,116) scale(1.02)">
    <!-- drop motion lines -->
    <line x1="-9" y1="-95" x2="-9" y2="-86" stroke="#FF6B5E" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="9" y1="-95" x2="9" y2="-86" stroke="#FF6B5E" stroke-width="4.5" stroke-linecap="round"/>
    <!-- handle -->
    <path d="M-21,-52 L-21,-72 Q-21,-79 -13,-79 L13,-79 Q21,-79 21,-72 L21,-52" fill="none" stroke="#E8F5F2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- body -->
    <rect x="-47" y="-52" width="94" height="108" rx="18" fill="url(#case)"/>
    <!-- coral strap -->
    <rect x="-47" y="-16" width="94" height="22" fill="#FF6B5E"/>
    <!-- buckle -->
    <rect x="-10" y="-19" width="20" height="28" rx="5" fill="#FFF3EC"/>
    <!-- seams -->
    <line x1="-30" y1="-46" x2="-30" y2="50" stroke="#0B6B65" stroke-width="2.5" stroke-opacity="0.5"/>
    <line x1="30" y1="-46" x2="30" y2="50" stroke="#0B6B65" stroke-width="2.5" stroke-opacity="0.5"/>
    <!-- wheels -->
    <circle cx="-26" cy="63" r="9" fill="#E8F5F2"/>
    <circle cx="26" cy="63" r="9" fill="#E8F5F2"/>
  </g>
</svg>
