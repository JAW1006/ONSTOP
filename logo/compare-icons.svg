<svg width="820" height="340" viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="tileDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3B54"/><stop offset="1" stop-color="#0C2233"/>
    </linearGradient>
    <linearGradient id="tileLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAFBF7"/><stop offset="1" stop-color="#C6F0E9"/>
    </linearGradient>
    <linearGradient id="caseG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C9B7"/><stop offset="1" stop-color="#0E8C84"/>
    </linearGradient>

    <g id="mark">
      <line x1="-9" y1="-95" x2="-9" y2="-86" stroke="#FF6B5E" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="9" y1="-95" x2="9" y2="-86" stroke="#FF6B5E" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="-47" y="-52" width="94" height="108" rx="18" fill="url(#caseG)"/>
      <rect x="-47" y="-16" width="94" height="22" fill="#FF6B5E"/>
      <rect x="-10" y="-19" width="20" height="28" rx="5" fill="#FFF3EC"/>
      <line x1="-30" y1="-46" x2="-30" y2="50" stroke="#0B6B65" stroke-width="2.5" stroke-opacity="0.5"/>
      <line x1="30" y1="-46" x2="30" y2="50" stroke="#0B6B65" stroke-width="2.5" stroke-opacity="0.5"/>
    </g>
  </defs>

  <rect width="820" height="340" fill="#F7FBFA"/>

  <!-- Dark (기존) -->
  <g transform="translate(70,60)">
    <rect width="220" height="220" rx="52" fill="url(#tileDark)"/>
    <circle cx="110" cy="108" r="92" fill="#FFFFFF" fill-opacity="0.10"/>
    <g transform="translate(110,116) scale(1.02)">
      <use href="#mark"/>
      <path d="M-21,-52 L-21,-72 Q-21,-79 -13,-79 L13,-79 Q21,-79 21,-72 L21,-52" fill="none" stroke="#E8F5F2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-26" cy="63" r="9" fill="#E8F5F2"/><circle cx="26" cy="63" r="9" fill="#E8F5F2"/>
    </g>
  </g>
  <text x="180" y="312" text-anchor="middle" fill="#5E7C79" font-size="13" letter-spacing="1.5" font-weight="600">기존 (DARK)</text>

  <!-- Light mint -->
  <g transform="translate(300,60)">
    <rect width="220" height="220" rx="52" fill="url(#tileLight)"/>
    <circle cx="110" cy="108" r="92" fill="#FFFFFF" fill-opacity="0.55"/>
    <g transform="translate(110,116) scale(1.02)">
      <use href="#mark"/>
      <path d="M-21,-52 L-21,-72 Q-21,-79 -13,-79 L13,-79 Q21,-79 21,-72 L21,-52" fill="none" stroke="#153A52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-26" cy="63" r="9" fill="#FFFFFF"/><circle cx="26" cy="63" r="9" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="410" y="312" text-anchor="middle" fill="#0E8C84" font-size="13" letter-spacing="1.5" font-weight="700">LIGHT (민트)</text>

  <!-- White -->
  <g transform="translate(530,60)">
    <rect width="220" height="220" rx="52" fill="#FFFFFF" stroke="#E4F0EE"/>
    <circle cx="110" cy="108" r="94" fill="none" stroke="#EAF6F4" stroke-width="10"/>
    <g transform="translate(110,116) scale(1.02)">
      <use href="#mark"/>
      <path d="M-21,-52 L-21,-72 Q-21,-79 -13,-79 L13,-79 Q21,-79 21,-72 L21,-52" fill="none" stroke="#153A52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-26" cy="63" r="9" fill="#153A52"/><circle cx="26" cy="63" r="9" fill="#153A52"/>
    </g>
  </g>
  <text x="640" y="312" text-anchor="middle" fill="#5E7C79" font-size="13" letter-spacing="1.5" font-weight="600">WHITE</text>
</svg>
