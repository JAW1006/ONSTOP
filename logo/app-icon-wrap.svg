<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAFBF7"/><stop offset="1" stop-color="#C6F0E9"/>
    </linearGradient>
    <linearGradient id="caseW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C9B7"/><stop offset="1" stop-color="#0E8C84"/>
    </linearGradient>
  </defs>

  <rect width="220" height="220" rx="52" fill="url(#tileW)"/>
  <circle cx="110" cy="110" r="92" fill="#FFFFFF" fill-opacity="0.55"/>

  <g transform="translate(110,92) scale(1.12)">
    <!-- BACK of orbit (left side, behind suitcase) -->
    <path d="M0,-53 A46,61 0 0 0 0,69" fill="none" stroke="#0E8C84" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.5 9"/>

    <!-- suitcase -->
    <path d="M-18,-25 L-18,-42 Q-18,-48 -11,-48 L11,-48 Q18,-48 18,-42 L18,-25" fill="none" stroke="#153A52" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-40" y="-25" width="80" height="95" rx="16" fill="url(#caseW)"/>
    <rect x="-40" y="6" width="80" height="19" fill="#FF6B5E"/>
    <rect x="-8" y="3" width="16" height="25" rx="4" fill="#FFF3EC"/>
    <line x1="-25" y1="-20" x2="-25" y2="64" stroke="#0B6B65" stroke-width="2.2" stroke-opacity="0.5"/>
    <line x1="25" y1="-20" x2="25" y2="64" stroke="#0B6B65" stroke-width="2.2" stroke-opacity="0.5"/>
    <circle cx="-22" cy="76" r="8" fill="#153A52"/>
    <circle cx="22" cy="76" r="8" fill="#153A52"/>

    <!-- FRONT of orbit (right side, over suitcase) -->
    <path d="M0,-53 A46,61 0 0 1 0,69" fill="none" stroke="#0E8C84" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.5 9"/>

    <!-- airplane descending the front, white keyline for contrast -->
    <g transform="translate(30,-38) rotate(128) scale(0.8)">
      <path d="M0,-15 C1.6,-15 2.6,-12 2.6,-8.5 L2.6,-3 L14,3.5 L14,8 L2.6,3.5 L2.6,9 L6,12.5 L6,14.5 L0,12.5 L-6,14.5 L-6,12.5 L-2.6,9 L-2.6,3.5 L-14,8 L-14,3.5 L-2.6,-3 L-2.6,-8.5 C-2.6,-12 -1.6,-15 0,-15 Z" fill="#FF6B5E" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
