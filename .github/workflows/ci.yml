# 프런트(Vitest·빌드)와 서버(예약 요청 API 통합 테스트)를 함께 검사한다.
# 서버 테스트는 **진짜 PostgreSQL**(서비스 컨테이너)에 붙어서 돈다 — 모의 DB가 아니다.
# 명세: docs/api/booking-requests.md · 확인 항목: docs/STATUS.md
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 포맷 검사 (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Prettier는 루트 devDependency 하나로 리포 전체(프런트 + server/*.js + docs/*.md)를 본다.
      # .prettierignore의 자동 생성 문서·레거시 app/index.html·lock 파일은 빠진다.
      - run: npx prettier --check .

  web:
    name: 프런트 — 테스트 + 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: 서버 — 예약 요청 API 통합 테스트 (진짜 Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timestay
          POSTGRES_PASSWORD: timestay-test-only
          POSTGRES_DB: timestay_test
        ports:
          - 5432:5432
        # 포트가 열려도 초기화가 덜 끝났을 수 있어 pg_isready로 기다린다.
        options: >-
          --health-cmd "pg_isready -U timestay -d timestay_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 의존성 설치
        working-directory: server
        run: npm ci

      - name: 통합 테스트 (진짜 Postgres) + 오류 코드 일치 테스트
        working-directory: server
        env:
          # 서비스 컨테이너를 가리킨다. 테스트는 테이블을 TRUNCATE하므로 일회용 DB만 쓴다.
          TEST_DATABASE_URL: postgresql://timestay:timestay-test-only@127.0.0.1:5432/timestay_test
          # 실제 DB 주소가 테스트로 새지 않게 비워 둔다.
          DATABASE_URL: ""
        # docker compose를 쓰는 npm test 대신, 이미 떠 있는 서비스 컨테이너에 바로 붙는다.
        # 인자 없는 node --test는 server/ 밑의 *.test.js를 전부 돈다(booking.test.js + errors-consistency.test.js).
        # 가드에 걸려 조용히 건너뛰면 CI가 통과한 것처럼 보이므로 건너뜀 문구는 실패로 본다.
        run: |
          set -o pipefail
          node --test 2>&1 | tee /tmp/server-test.log
          if grep -q "건너뜀" /tmp/server-test.log; then
            echo "✗ 통합 테스트가 건너뛰어졌다 — Postgres 연결·가드를 확인하라" >&2
            exit 1
          fi

  secrets:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env 파일이 추적되는지
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "✗ .env 파일이 저장소에 추적되고 있다" >&2
            exit 1
          fi
          echo "✅ 추적되는 .env 없음"
      - name: DB 접속 문자열 (로컬 주소는 허용)
        run: |
          # 파일을 넓게 제외하면 검사가 무력해지므로, 호스트가 로컬인 것만 걸러낸다.
          hits=$(git grep -nEI 'postgres(ql)?://[^[:space:]<$]+@' \
                   -- . ':(exclude)*package-lock.json' \
                 | grep -vE '@(localhost|127\.0\.0\.1|postgres|db)[:/]' || true)
          if [ -n "$hits" ]; then
            echo "✗ 원격 DB 접속 문자열로 보이는 값이 있다:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "✅ 원격 접속 문자열 없음"

      - name: API 키·토큰 패턴
        run: |
          hits=$(git grep -nEI \
            'KakaoAK [A-Za-z0-9]|serviceKey=[A-Za-z0-9%]{10}|eyJ[A-Za-z0-9_-]{20}|sb[ps]_[A-Za-z0-9]{10}|AIza[A-Za-z0-9_-]{30}|gh[pousr]_[A-Za-z0-9]{30}' \
            -- . ':(exclude)*package-lock.json' ':(exclude)*.md' || true)
          if [ -n "$hits" ]; then
            echo "✗ API 키로 보이는 값이 있다:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "✅ 키 패턴 없음"

  commitlint:
    name: 커밋 메시지 형식 (docs/conventions.md 9장)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이 푸시/PR이 들여온 범위를 git log로 계산하려면 전체 이력이 필요하다.

      - name: 이 푸시/PR이 추가한 커밋 제목만 검사
        run: |
          # PR: GitHub가 만드는 가상 병합 커밋(github.sha)이 아니라 실제 PR 헤드를 쓴다. 가상 병합 커밋은
          #     첫 부모가 base라서 --first-parent로 걸으면 PR 쪽 커밋을 하나도 못 본다. base가 이제 이 브랜치의
          #     실제 조상이므로 base..head 만으로 PR이 추가한 커밋이 정확히 잡힌다(--first-parent 불필요).
          # push: before..after 는 이 브랜치 자신의 이전 상태라서 --first-parent 로 병합돼 들어온 쪽 역사를 걸러낸다.
          # --no-merges: 병합 커밋 자체(제목이 보통 "Merge ...")는 형식 검사 대상이 아니다.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            LOG_FLAGS="--no-merges"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            LOG_FLAGS="--no-merges --first-parent"
          else
            # 새 브랜치의 첫 푸시 등 이전 상태가 없는 경우 — 최신 커밋 하나만 본다.
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
            LOG_FLAGS="--no-merges --first-parent"
          fi

          git log $LOG_FLAGS --format=%s "$RANGE" > /tmp/subjects.txt
          echo "검사 범위: $RANGE (git log $LOG_FLAGS)"
          cat /tmp/subjects.txt

          # docs/conventions.md 9장 — 2026-10-18부터 적용. 그 전 커밋은 검사하지 않는다(과거 커밋은 다시 안 씀).
          PATTERN='^(feat|fix|docs|test|refactor|chore)(\([a-z0-9.-]+\))?: .+'
          fail=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! echo "$line" | grep -qE "$PATTERN"; then
              echo "✗ 커밋 메시지가 '<type>: <설명>' 형식이 아니다 (type: feat/fix/docs/test/refactor/chore): $line" >&2
              fail=1
            fi
          done < /tmp/subjects.txt
          exit $fail
