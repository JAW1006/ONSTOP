<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TimeStay 예약 요청 관리</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 내부용 관리 화면. HTTP Basic 인증 뒤에서만 서빙된다(server/booking.js).
     명세: docs/api/booking-requests.md · 화면 규칙: docs/design/screens/booking.md -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F3F5F9; color: #16233F; }
  header { padding: 20px 24px 14px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #6B7B99; }
  .notice { margin: 0 24px 14px; padding: 11px 14px; border-radius: 10px; font-size: 12px; line-height: 1.6; background: #FFF3D6; color: #7A5205; border: 1px solid #F0DCA8; }
  .notice b { color: #5C3D02; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 0 24px 14px; flex-wrap: wrap; }
  select, button.refresh { font-size: 12.5px; padding: 7px 12px; border-radius: 8px; border: 1px solid #D5DCEA; background: #fff; color: #16233F; cursor: pointer; }
  button.refresh { border-color: #2255DD; color: #2255DD; font-weight: 700; }
  .count { font-size: 12px; color: #6B7B99; margin-left: auto; }
  .empty, .error { padding: 60px 24px; text-align: center; font-size: 13.5px; }
  .empty { color: #8895AC; }
  .error { color: #A13A3A; }
  .list { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid #E3E8F2; border-radius: 14px; padding: 16px 18px; }
  .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .room { font-weight: 800; font-size: 14.5px; }
  .reqid { font-size: 11.5px; color: #6B7B99; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 2px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.requested { background: #FFF3D6; color: #A9720C; }
  .badge.confirmed { background: #E1F5E9; color: #1F8A4C; }
  .badge.declined  { background: #F2E4E4; color: #A13A3A; }
  .badge.expired   { background: #ECEFF5; color: #68758C; }
  .badge.cancelled { background: #ECEFF5; color: #68758C; }
  .badge.mode { background: #E8EEFC; color: #2A4C9B; }
  .badge.demo { background: #F0E6FA; color: #6B3FA0; }
  .meta { font-size: 12.5px; color: #4C5A78; margin-top: 10px; line-height: 1.8; }
  .meta b { color: #16233F; }
  .meta a { color: #2255DD; text-decoration: none; font-weight: 700; }
  .plan { font-size: 11.5px; color: #6B7B99; margin-top: 6px; }
  .reason { margin-top: 8px; font-size: 12.5px; color: #A13A3A; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions button { font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #D5DCEA; background: #fff; }
  .actions button.confirm { color: #1F8A4C; border-color: #BEE6CE; }
  .actions button.decline { color: #A13A3A; border-color: #F0C9C9; }
  .actions button:disabled { opacity: .4; cursor: default; }
  .final { font-size: 11.5px; color: #8895AC; margin-top: 12px; }
  .created { font-size: 10.5px; color: #A7B1C4; margin-top: 10px; }
  .consent { font-size: 10.5px; color: #A7B1C4; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1>예약 요청 관리</h1>
  <div class="sub">TimeStay 앱으로 들어온 요청 — 결제 없음. 호텔에 직접 확인한 결과를 여기에 반영하세요.</div>
</header>
<div class="notice">
  <b>운영 배포 금지 유지</b> — 요청이 자동으로 호텔에 전달되지 않습니다. 호텔 전달·회신·이메일 발송이 구현되기 전까지 운영(prod) 배포는 금지입니다(docs/STATUS.md, ADR-0005).<br>
  이 화면에는 이용자의 <b>이름·이메일</b>이 보입니다. 보관 기간·파기 방침은 아직 정해지지 않았습니다(legal-checklist 2-1). 화면을 공유하거나 캡처하지 마세요.
</div>
<div class="toolbar">
  <select id="filter">
    <option value="all" selected>전체</option>
    <option value="requested">요청됨(확인 중)</option>
    <option value="confirmed">확정</option>
    <option value="declined">거절</option>
    <option value="expired">만료</option>
    <option value="cancelled">취소됨</option>
  </select>
  <button class="refresh" id="refreshBtn">새로고침</button>
  <span class="count" id="count"></span>
</div>
<div id="root"></div>
<script>
const STATUS_LABEL = {
  requested: "요청됨 · 호텔 확인 중",
  confirmed: "확정",
  declined: "거절",
  expired: "만료",
  cancelled: "취소됨",
};
const MODE_LABEL = { product: "상품 요청", quote: "견적 요청" };
const LANG_LABEL = { ko: "한국어", en: "English", zh: "中文", ja: "日本語", vi: "Tiếng Việt" };

// docs/api/booking-requests.md "상태" 표와 같은 전이만 버튼으로 노출한다.
const NEXT = {
  requested: ["confirmed", "declined", "expired", "cancelled"],
  confirmed: ["cancelled"],
  declined: [], expired: [], cancelled: [],
};
const ACTION_LABEL = { confirmed: "확정 처리", declined: "거절 처리", expired: "만료 처리", cancelled: "취소 처리" };

let all = [];

// 도착일 0시 기준 분 → HH:MM. 자정을 넘기면 (+N일)을 붙인다(A2).
function fmtMin(min) {
  if (min == null) return "-";
  const mm = ((min % 1440) + 1440) % 1440;
  const dayOffset = Math.floor(min / 1440);
  const h = String(Math.floor(mm / 60)).padStart(2, "0");
  const m = String(mm % 60).padStart(2, "0");
  return dayOffset !== 0 ? `${h}:${m} (+${dayOffset}일)` : `${h}:${m}`;
}

const fmtWon = (n) => (n == null ? "-" : `${n.toLocaleString("ko-KR")}원`);
const fmtAt = (iso) => new Date(iso).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function loadRequests() {
  const res = await fetch("/api/booking-requests");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body?.error?.message || `목록을 불러오지 못했어요 (HTTP ${res.status})`);
  }
  const body = await res.json();
  return body.requests || [];
}

async function setStatus(id, status, declineReason) {
  const res = await fetch(`/api/booking-requests/${encodeURIComponent(id)}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(declineReason ? { status, declineReason } : { status }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body?.error?.message || `상태를 바꾸지 못했어요 (HTTP ${res.status})`);
  }
}

function cardHtml(r) {
  const price = r.mode === "product"
    ? `<b>${fmtWon(r.price)}</b>${r.hours ? ` · ${r.hours}시간 블록` : ""} <span class="sub">(예상 금액 · 결제 아님)</span>`
    : "<b>견적 대기</b> — 호텔이 가격을 회신합니다";

  const actions = NEXT[r.status].length
    ? `<div class="actions">${NEXT[r.status]
        .map((s) => `<button class="${s === "confirmed" ? "confirm" : s === "declined" ? "decline" : ""}" data-id="${esc(r.id)}" data-status="${s}">${ACTION_LABEL[s]}</button>`)
        .join("")}</div>`
    : `<div class="final">종료된 요청이에요 — 더 바꿀 수 없습니다.</div>`;

  return `<div class="card">
    <div class="row1">
      <div>
        <div class="room">${esc(r.roomId)}</div>
        <div class="reqid">${esc(r.id)}</div>
      </div>
      <div class="badges">
        <span class="badge ${r.status}">${STATUS_LABEL[r.status] || esc(r.status)}</span>
        <span class="badge mode">${MODE_LABEL[r.mode] || esc(r.mode)}</span>
        ${r.priceSource === "demo" ? '<span class="badge demo">데모 가격</span>' : ""}
      </div>
    </div>
    <div class="meta">
      이용 <b>${fmtMin(r.checkInMin)} – ${fmtMin(r.endMin)}</b><br>
      ${price}<br>
      연락처 <b>${esc(r.name)}</b> · <a href="mailto:${encodeURIComponent(r.email)}">${esc(r.email)}</a> · 회신 언어 ${LANG_LABEL[r.lang] || esc(r.lang)}
    </div>
    ${r.planIds.length ? `<div class="plan">코스 장소 ${r.planIds.length}곳 · ${r.planIds.map(esc).join(", ")}</div>` : '<div class="plan">코스 없음 (숙소만 요청)</div>'}
    ${r.declineReason ? `<div class="reason">거절 사유: ${esc(r.declineReason)}</div>` : ""}
    ${actions}
    <div class="created">요청 ${fmtAt(r.createdAt)}${r.updatedAt !== r.createdAt ? ` · 변경 ${fmtAt(r.updatedAt)}` : ""}</div>
    <div class="consent">동의 ${fmtAt(r.consentedAt)} (문구 ${esc(r.consentVersion)})</div>
  </div>`;
}

function render() {
  const filter = document.getElementById("filter").value;
  const shown = filter === "all" ? all : all.filter((r) => r.status === filter);
  document.getElementById("count").textContent = `${shown.length} / ${all.length}건`;
  document.getElementById("root").innerHTML = shown.length
    ? `<div class="list">${shown.map(cardHtml).join("")}</div>`
    : '<div class="empty">해당하는 요청이 없어요.</div>';
}

async function refresh() {
  try {
    all = await loadRequests();
    render();
  } catch (err) {
    document.getElementById("count").textContent = "";
    document.getElementById("root").innerHTML = `<div class="error">${esc(err.message)}</div>`;
  }
}

document.getElementById("filter").addEventListener("change", render);
document.getElementById("refreshBtn").addEventListener("click", refresh);

document.getElementById("root").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-status]");
  if (!btn) return;
  const { id, status } = btn.dataset;

  let declineReason;
  if (status === "declined") {
    // 거절은 사유가 필수다 — 화면이 사용자에게 사유를 보여준다(screens/booking 5번).
    declineReason = prompt("호텔이 준 거절 사유를 적어주세요 (이용자에게 표시됩니다)");
    if (!declineReason || !declineReason.trim()) return;
  } else if (!confirm(`${ACTION_LABEL[status]}할까요? (${id})`)) {
    return;
  }

  btn.disabled = true;
  try {
    await setStatus(id, status, declineReason && declineReason.trim());
    await refresh();
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
  }
});

refresh();
</script>
</body>
</html>
