<script type="text/babel" data-type="module" data-presets="react">
import React, { useState } from "react";
import { createRoot } from "react-dom/client";
import {
  Plane, PlaneLanding, Bell, Clock, Bed, Droplets, Luggage, MapPin,
  Utensils, Sparkles, ShoppingBag, Scissors, Coffee, Check, ChevronRight,
  ChevronLeft, Home as HomeIcon, Search, User, CalendarCheck, Ticket,
  ShieldCheck, Route, Camera, Waves,
} from "lucide-react";

/* ---------- brand palette (DropShopping) ---------- */
const C = {
  blue: "#2F7BE6", blueDeep: "#164FAE", ink: "#153A52",
  gold: "#F2B134", goldDeep: "#D9971A", red: "#E23B3B", lime: "#8DBE36",
  bg: "#F1F5FA", card: "#FFFFFF", tint: "#EAF1FB",
  sub: "#5E7185", faint: "#A9B4C4", line: "#E3EAF3", white: "#FFFFFF",

const grad = `linear-gradient(135deg, ${C.blue}, ${C.blueDeep})`;

/* ---------- brand logo ---------- */
const Brand = ({ h = 30, dark = true }) => (
  <div style={{ display: "inline-flex", alignItems: "center", gap: Math.round(h * 0.34) }}>
    <img src="assets/logo-mark.png" alt="DropShopping" style={{ height: h, width: "auto", display: "block" }} />
    <span style={{ fontSize: Math.round(h * 0.66), fontWeight: 800, letterSpacing: -0.4, lineHeight: 1 }}>
      <span style={{ color: dark ? "#fff" : C.ink }}>Drop</span><span style={{ color: C.gold }}>Shopping</span>
    </span>
  </div>
);

/* ---------- ui helpers ---------- */
const Card = ({ children, style }) => (
  <div style={{ background: C.card, borderRadius: 18, boxShadow: "0 2px 14px rgba(40,70,130,0.07)", ...style }}>{children}</div>
);
const Chip = ({ children, active, onClick }) => (
  <button onClick={onClick} style={{ border: "none", cursor: "pointer", padding: "6px 12px", borderRadius: 999, fontSize: 12, fontWeight: 600, whiteSpace: "nowrap", background: active ? C.blue : C.tint, color: active ? "#fff" : C.blueDeep }}>{children}</button>
);
const PrimaryBtn = ({ children, onClick, style }) => (
  <button onClick={onClick} style={{ width: "100%", border: "none", cursor: "pointer", padding: "15px 0", borderRadius: 14, background: grad, color: "#fff", fontSize: 15, fontWeight: 700, boxShadow: "0 6px 16px rgba(47,123,230,0.32)", ...style }}>{children}</button>
);
const SectionHead = ({ title, sub, onMore }) => (
  <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 12 }}>
    <div>
      <div style={{ fontSize: 16, fontWeight: 800, color: C.ink }}>{title}</div>
      {sub && <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>{sub}</div>}
    </div>
    {onMore && <button onClick={onMore} style={{ border: "none", background: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 2, color: C.sub, fontSize: 12 }}>더보기 <ChevronRight size={14} /></button>}
  </div>
);
const Photo = ({ icon, tint, h = 96, badge }) => (
  <div style={{ position: "relative", height: h, borderRadius: 12, background: tint, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
    {badge && <span style={{ position: "absolute", top: 8, left: 8, background: C.blue, color: "#fff", fontSize: 10, fontWeight: 700, padding: "3px 8px", borderRadius: 999 }}>{badge}</span>}
    <div style={{ opacity: 0.55 }}>{icon}</div>
  </div>
);

/* ---------- data ---------- */
const LANGS = [{ k: "English", f: "🇺🇸" }, { k: "中文(简体)", f: "🇨🇳" }, { k: "日本語", f: "🇯🇵" }, { k: "Tiếng Việt", f: "🇻🇳" }, { k: "한국어", f: "🇰🇷" }];
const CATS = [
  { k: "Food", ko: "맛집", icon: Utensils }, { k: "Massage", ko: "마사지", icon: Sparkles },
  { k: "Shopping", ko: "쇼핑", icon: ShoppingBag }, { k: "Rest", ko: "휴식", icon: Bed },
  { k: "Beauty", ko: "뷰티", icon: Scissors }, { k: "Sightseeing", ko: "관광", icon: Camera },
];
const ROOMS = [
  { name: "AIR SKY 데이유즈", dist: "공항 7분", block: "3–9시간", price: 42000, rate: 4.8, cnt: 128, tint: "#BBD3F5", best: true, move: 7, rest: 90 },
  { name: "운서 스테이", dist: "공항 10분", block: "3–6시간", price: 38000, rate: 4.6, cnt: 93, tint: "#CFE0F5", move: 10, rest: 90 },
  { name: "영종 캡슐 리프레시", dist: "공항 5분", block: "3–4시간", price: 24000, rate: 4.5, cnt: 76, tint: "#C7E4D6", move: 5, rest: 60 },
];
const ROUTE = [
  { t: "11:00", title: "공항 도착 · 짐 맡기기", sub: "수하물 케어 픽업", ic: Luggage, col: C.red },
  { t: "11:20", title: "데이유즈 체크인 · 샤워/휴식", sub: "4시간 타임블록", ic: Bed, col: C.blue },
  { t: "15:30", title: "K-뷰티 · 쇼핑", sub: "선호: 쇼핑", ic: ShoppingBag, col: C.gold },
  { t: "16:20", title: "카페 & 지역 탐방", sub: "영종도 오션뷰", ic: Coffee, col: C.lime },
  { t: "17:00", title: "공항 복귀 (여유 30분)", sub: "Time-Safe 알림", ic: PlaneLanding, col: C.ink },
];
const LOCAL = [
  { n: "카페 오션뷰", s: "영종도 · 45분", icon: Coffee, tint: "#F3D9B8" },
  { n: "마시안 마사지", s: "피로 회복 · 60분", icon: Sparkles, tint: "#E8C4D6" },
  { n: "차이나타운 맛집", s: "중식 · 50분", icon: Utensils, tint: "#F3C4B8" },
  { n: "무의도 해변", s: "선셋 · 90분", icon: Waves, tint: "#A9C4E8" },
];
const won = (n) => "₩" + n.toLocaleString();

/* ---------- airport API (via local proxy) ---------- */
const PROXY_BASE = "http://localhost:3001";
const DEFAULT_ARRIVE = 10 * 60 + 30; // 실시간 조회 실패/미조회 시 데모 폴백값
const LAYOVER_BUDGET = 360; // 고정 6시간 레이오버 예산(분)
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const parseHHMM = (s) => {
  if (!s || s.length < 3) return null;
  const h = parseInt(s.slice(0, s.length - 2), 10);
  const m = parseInt(s.slice(-2), 10);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
};
async function fetchArrival(flightId) {
  const res = await fetch(`${PROXY_BASE}/api/flight/arrival?flightId=${encodeURIComponent(flightId)}`);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `조회 실패 (${res.status})`);
  const f = data.flights && data.flights[0];
  if (!f) throw new Error("일치하는 항공편이 없어요");
  const arriveMin = parseHHMM(f.estimatedDateTime) ?? parseHHMM(f.scheduleDateTime);
  if (arriveMin == null) throw new Error("도착 시각 정보가 없어요");
  return { arriveMin, flight: f };
}

/* ================= APP ================= */
function App() {
  const [screen, setScreen] = useState("onboarding");
  const [step, setStep] = useState(0);
  const [lang, setLang] = useState("English");
  const [cats, setCats] = useState(["Shopping", "Rest"]);
  const [flight, setFlight] = useState("KE085");
  const [room, setRoom] = useState(ROOMS[0]);
  const toggle = (k) => setCats((p) => (p.includes(k) ? p.filter((x) => x !== k) : [...p, k]));

  const [flightLookup, setFlightLookup] = useState({ status: "idle" });
  const lookupFlight = async (flightId) => {
    if (!flightId) return;
    setFlightLookup({ status: "loading" });
    try {
      const { arriveMin, flight: f } = await fetchArrival(flightId);
      setFlightLookup({ status: "success", arriveMin, flight: f });
    } catch (e) {
      setFlightLookup({ status: "error", message: e.message || "실시간 조회에 실패했어요" });
    }
  };
  const arriveMin = flightLookup.status === "success" ? flightLookup.arriveMin : DEFAULT_ARRIVE;
  const returnByMin = arriveMin + LAYOVER_BUDGET;

  return (
    <div style={{ minHeight: "100vh", background: "#E6ECF6", display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "20px 12px", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" }}>
      <div style={{ width: 390, maxWidth: "100%", height: 800, background: C.bg, borderRadius: 34, overflow: "hidden", position: "relative", boxShadow: "0 20px 60px rgba(30,50,110,0.25)", border: "6px solid #101826" }}>
        <div style={{ position: "absolute", inset: 0, bottom: screen === "onboarding" ? 0 : 66, overflowY: "auto" }}>
          {screen === "onboarding" && <Onboarding {...{ step, setStep, lang, setLang, cats, toggle, flight, setFlight, go: () => setScreen("home"), flightLookup, onLookup: lookupFlight, arriveMin, returnByMin }} />}
          {screen === "home" && <HomeScreen {...{ cats, openRoom: (r) => { setRoom(r); setScreen("booking"); }, setScreen, flight, arrive: arriveMin, returnBy: returnByMin, flightLookup }} />}
          {screen === "booking" && <Booking room={room} onPay={() => setScreen("confirm")} back={() => setScreen("home")} />}
          {screen === "confirm" && <Confirm room={room} back={() => setScreen("home")} />}
          {screen === "luggage" && <Luggagepage back={() => setScreen("home")} />}
          {screen === "course" && <Course cats={cats} back={() => setScreen("home")} onBook={(r) => { setRoom(r); setScreen("booking"); }} arrive={arriveMin} returnBy={returnByMin} />}
          {screen === "mypage" && <MyPage />}
        </div>
        {screen !== "onboarding" && (
          <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 66, background: "#fff", borderTop: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "space-around", paddingBottom: 4 }}>
            <Nav icon={HomeIcon} label="홈" active={screen === "home"} onClick={() => setScreen("home")} />
            <Nav icon={Luggage} label="짐 케어" active={screen === "luggage"} onClick={() => setScreen("luggage")} />
            <button onClick={() => setScreen("course")} style={{ border: "none", cursor: "pointer", marginTop: -22, width: 56, height: 56, borderRadius: 28, background: grad, color: "#fff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 16px rgba(47,123,230,.45)" }}>
              <Route size={20} /><span style={{ fontSize: 8, marginTop: 1, fontWeight: 700 }}>코스</span>
            </button>
            <Nav icon={CalendarCheck} label="예약" active={screen === "confirm" || screen === "booking"} onClick={() => setScreen("confirm")} />
            <Nav icon={User} label="마이" active={screen === "mypage"} onClick={() => setScreen("mypage")} />
          </div>
        )}
      </div>
    </div>
  );
}
const Nav = ({ icon: Icon, label, active, onClick }) => (
  <button onClick={onClick} style={{ border: "none", background: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: active ? C.blue : C.faint, width: 60 }}>
    <Icon size={20} /><span style={{ fontSize: 10, fontWeight: active ? 700 : 500 }}>{label}</span>
  </button>
);

/* ---------- ONBOARDING ---------- */
function Onboarding({ step, setStep, lang, setLang, cats, toggle, flight, setFlight, go, flightLookup, onLookup, arriveMin, returnByMin }) {
  return (
    <div style={{ minHeight: "100%", background: grad, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "38px 24px 16px", color: "#fff" }}>
        <Brand h={40} dark />
        <div style={{ fontSize: 26, fontWeight: 900, marginTop: 18, lineHeight: 1.2 }}>짐은 맡기고,<br />환승 시간을 인천에서</div>
        <div style={{ fontSize: 12.5, opacity: 0.9, marginTop: 8 }}>Transit · Drop · Fly Light</div>
      </div>
      <div style={{ flex: 1, background: C.bg, borderTopLeftRadius: 26, borderTopRightRadius: 26, padding: "20px 20px 28px" }}>
        <div style={{ display: "flex", gap: 6, justifyContent: "center", marginBottom: 20 }}>
          {[0, 1, 2].map((i) => <div key={i} style={{ width: i === step ? 22 : 7, height: 7, borderRadius: 999, background: i === step ? C.blue : C.line }} />)}
        </div>

        {step === 0 && (<>
          <Title ko="언어를 선택해주세요" en="Choose your language" />
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 16 }}>
            {LANGS.map((l) => (
              <button key={l.k} onClick={() => setLang(l.k)} style={row(lang === l.k)}>
                <span style={{ fontSize: 20 }}>{l.f}</span>
                <span style={{ flex: 1, textAlign: "left", fontWeight: 600, color: C.ink }}>{l.k}</span>
                {lang === l.k && <Check size={18} color={C.blue} />}
              </button>
            ))}
          </div>
          <PrimaryBtn onClick={() => setStep(1)} style={{ marginTop: 20 }}>다음</PrimaryBtn>
        </>)}

        {step === 1 && (<>
          <Title ko="관심 있는 활동을 골라주세요" en="Pick your interests" note="복수 선택 · Time-Fit 추천에 사용" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 16 }}>
            {CATS.map((c) => {
              const on = cats.includes(c.k); const Icon = c.icon;
              return (
                <button key={c.k} onClick={() => toggle(c.k)} style={{ border: on ? `2px solid ${C.blue}` : `1.5px solid ${C.line}`, background: on ? C.tint : "#fff", borderRadius: 14, padding: "16px 6px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
                  <Icon size={22} color={on ? C.blue : C.sub} />
                  <span style={{ fontSize: 12, fontWeight: 700, color: on ? C.blueDeep : C.ink }}>{c.ko}</span>
                </button>
              );
            })}
          </div>
          <PrimaryBtn onClick={() => setStep(2)} style={{ marginTop: 20 }}>다음</PrimaryBtn>
        </>)}

        {step === 2 && (<>
          <Title ko="환승 항공편을 입력해주세요" en="Your connecting flight" note="Time-Safe 여유 시간 자동 계산" />
          <div style={{ marginTop: 16, background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 14, padding: "14px 16px", display: "flex", alignItems: "center", gap: 10 }}>
            <Plane size={18} color={C.blue} />
            <input value={flight} onChange={(e) => setFlight(e.target.value.toUpperCase())} placeholder="예: KE085"
              style={{ border: "none", outline: "none", fontSize: 17, fontWeight: 700, color: C.ink, width: "100%", background: "transparent" }} />
            <button onClick={() => onLookup(flight)} disabled={!flight || flightLookup.status === "loading"}
              style={{ border: "none", cursor: flight ? "pointer" : "not-allowed", padding: "8px 12px", borderRadius: 10, background: C.tint, color: C.blueDeep, fontSize: 12, fontWeight: 700, whiteSpace: "nowrap", flexShrink: 0 }}>
              {flightLookup.status === "loading" ? "조회 중…" : "실시간 조회"}
            </button>
          </div>
          {flightLookup.status === "error" && (
            <div style={{ marginTop: 8, fontSize: 11.5, color: C.red }}>{flightLookup.message} · 데모 값({hhmm(DEFAULT_ARRIVE)} 도착 기준)으로 계산할게요.</div>
          )}
          <div style={{ marginTop: 14, background: C.ink, borderRadius: 16, padding: "16px 18px", color: "#fff" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12, color: "#BFD3F0" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}><ShieldCheck size={15} /> TIME-SAFE 계산 결과</span>
              <span style={{ fontSize: 10, fontWeight: 700, color: flightLookup.status === "success" ? C.lime : "#9FB6D4" }}>
                {flightLookup.status === "success" ? "인천공항공사 실시간" : "데모 값"}
              </span>
            </div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 8 }}>
              <span style={{ fontSize: 36, fontWeight: 900, color: C.gold }}>{Math.floor(LAYOVER_BUDGET / 60)}시간</span>
              <span style={{ fontSize: 13, color: "#CFE0F5" }}>공항 밖 체류 가능</span>
            </div>
            <div style={{ fontSize: 12.5, color: "#CFE0F5", marginTop: 6, display: "flex", alignItems: "center", gap: 6 }}>
              <Clock size={13} /> 도착 {hhmm(arriveMin)} · <b style={{ color: "#fff" }}>복귀 추천 {hhmm(returnByMin)}</b>
            </div>
            {flightLookup.status === "success" && (
              <div style={{ fontSize: 11, color: "#9FB6D4", marginTop: 6 }}>
                {flightLookup.flight.airline} {flightLookup.flight.flightId} · {flightLookup.flight.fromAirport}발 · {flightLookup.flight.terminal || "-"} 터미널 · 게이트 {flightLookup.flight.gate || "-"} · {flightLookup.flight.remark || "정상"}
              </div>
            )}
            <div style={{ fontSize: 11, color: "#9FB6D4", marginTop: 6, display: "flex", alignItems: "center", gap: 6 }}>
              <Bell size={12} /> 복귀 30분 전 푸시 알림 예약됨
            </div>
          </div>
          <PrimaryBtn onClick={go} style={{ marginTop: 18, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>스마트 코스 추천 <Route size={16} /></PrimaryBtn>
        </>)}
      </div>
    </div>
  );
}
const Title = ({ ko, en, note }) => (
  <div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <div style={{ fontSize: 17, fontWeight: 800, color: C.ink }}>{ko}</div>
      {note && <span style={{ fontSize: 10, color: C.faint, maxWidth: 130, textAlign: "right" }}>{note}</span>}
    </div>
    <div style={{ fontSize: 12, color: C.faint, marginTop: 3 }}>{en}</div>
  </div>
);
const row = (on) => ({ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderRadius: 14, border: on ? `2px solid ${C.blue}` : `1.5px solid ${C.line}`, background: on ? C.tint : "#fff", cursor: "pointer" });

/* ---------- HOME ---------- */
function HomeScreen({ cats, openRoom, setScreen, flight, arrive, returnBy, flightLookup }) {
  const tags = cats.map((k) => CATS.find((c) => c.k === k)?.ko).filter(Boolean);
  return (
    <div>
      <div style={{ background: grad, padding: "34px 20px 20px", color: "#fff", borderBottomLeftRadius: 22, borderBottomRightRadius: 22 }}>
        <Brand h={30} dark />
        <div style={{ fontSize: 21, fontWeight: 900, marginTop: 14 }}>Hello, Traveler! 👋</div>
        <div style={{ fontSize: 12.5, opacity: 0.9, marginTop: 3 }}>여유 시간에 딱 맞는 인천 코스를 준비했어요.</div>
      </div>

      <div style={{ padding: "16px 16px 20px" }}>
        <Card style={{ padding: 15, marginBottom: 16, borderLeft: `4px solid ${C.blue}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <ShieldCheck size={17} color={C.blue} /><span style={{ fontSize: 13.5, fontWeight: 800, color: C.ink }}>Time-Safe · {flight}</span>
            </div>
            <span style={{ fontSize: 11, fontWeight: 700, color: flightLookup.status === "success" ? "#2E9E5B" : C.sub, background: flightLookup.status === "success" ? "#E7F7EE" : C.line, padding: "3px 9px", borderRadius: 999 }}>{flightLookup.status === "success" ? "실시간" : "데모값"}</span>
          </div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 14, marginTop: 10 }}>
            <div><div style={{ fontSize: 28, fontWeight: 900, color: C.blueDeep }}>{Math.floor((returnBy - arrive) / 60)}:00</div><div style={{ fontSize: 10, color: C.faint }}>체류 가능</div></div>
            <div style={{ flex: 1, fontSize: 12, color: C.sub, lineHeight: 1.5 }}>도착 <b style={{ color: C.ink }}>{hhmm(arrive)}</b><br />공항 복귀 추천 <b style={{ color: C.red }}>{hhmm(returnBy)}</b></div>
          </div>
        </Card>

        <SectionHead title="Time-Fit 추천 코스" sub="관심사별로 골라 환승 일정 자동 생성" onMore={() => setScreen("course")} />
        <div onClick={() => setScreen("course")} style={{ cursor: "pointer", marginBottom: 18 }}>
          <Card style={{ padding: 16 }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
              {CATS.map((c) => {
                const Icon = c.icon; const on = cats.includes(c.k);
                return (
                  <span key={c.k} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 700, padding: "7px 11px", borderRadius: 999, background: on ? C.tint : "#F4F7FB", color: on ? C.blueDeep : C.sub }}>
                    <Icon size={13} /> {c.ko}
                  </span>
                );

const QR = () => {
  const n = 21, cells = []; let seed = 7;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const f = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    const on = f ? (x === 0 || x === 6 || y === 0 || y === 6 || (x >= 2 && x <= 4 && y >= 2 && y <= 4)) : rnd() > 0.55;
    if (on) cells.push(<rect key={`${x}-${y}`} x={x} y={y} width={1} height={1} fill={C.ink} />);
  }
  return <svg viewBox={`0 0 ${n} ${n}`} width={150} height={150} shapeRendering="crispEdges">{cells}</svg>;
};

const PREP = 20;                 // 짐 맡기기/준비

function Course({ cats, back, onBook, arrive, returnBy }) {
  const BUDGET = returnBy - arrive; // 분
  const initSel = (cats && cats.length) ? cats.filter((k) => k !== "Rest" && CAT_META[k]) : ["Shopping"];
  const [room, setRoom] = useState(null);
  const [sel, setSel] = useState(initSel.length ? initSel : ["Shopping"]);
  const [plan, setPlan] = useState([]);
  const inPlan = (p) => plan.some((x) => x.name === p.name);
  const toggleCat = (k) => setSel((prev) => (prev.includes(k) ? prev.filter((x) => x !== k) : [...prev, k]));
  const toggle = (p) => setPlan((prev) => (inPlan(p) ? prev.filter((x) => x.name !== p.name) : [...prev, p]));
  const remove = (name) => setPlan((prev) => prev.filter((x) => x.name !== name));

  const computeUsed = (arr) => {
    let c = PREP;
    if (room) c += room.move + room.rest;
    arr.forEach((p) => { c += p.move + p.dur; });
    c += arr.length ? arr[arr.length - 1].move : (room ? room.move : 0);
    return c;
  };
  const fitsWith = (arr) => computeUsed(arr) <= BUDGET;
  const autoBuild = () => {
    const chosen = [];
    (sel.length ? sel : ACT_KEYS).forEach((k) => {
      const opts = (PLACES[k] || []).map((p) => ({ ...p, cat: k }))
        .filter((p) => !chosen.some((c) => c.name === p.name))
        .sort((a, b) => (a.move + a.dur) - (b.move + b.dur));
      const best = opts.find((p) => fitsWith([...chosen, p]));
      if (best) chosen.push(best);
    });
    setPlan(chosen);
  };

  let clock = arrive;
  const steps = [{ t: clock, title: "공항 도착 · 짐 맡기기", sub: "수하물 케어 픽업", col: C.red, icon: Luggage }];

            </div>
            <span style={{ fontSize: 12, fontWeight: 800, color: over ? C.red : "#2E9E5B" }}>{over ? `${-remain}분 초과` : `여유 ${remain}분`}</span>

                  {on && <span style={{ position: "absolute", top: 6, right: 6, width: 20, height: 20, borderRadius: 999, background: C.blue, display: "flex", alignItems: "center", justifyContent: "center" }}><Check size={13} color="#fff" /></span>}
                </div>
                <div style={{ fontSize: 13, fontWeight: 800, color: C.ink, marginTop: 8 }}>{r.name}</div>
                <div style={{ fontSize: 10.5, color: C.faint, marginTop: 2 }}>{r.dist} · 휴식 {r.rest}분</div>
                <div style={{ fontSize: 12, fontWeight: 800, color: C.blueDeep, marginTop: 4 }}>{won(r.price)}~</div>
              </div>
            );
          })}
        </div>

        <div style={{ fontSize: 12, fontWeight: 800, color: C.ink, marginBottom: 8 }}>② 활동 카테고리 합치기 <span style={{ color: C.faint, fontWeight: 500 }}>(복수 선택)</span></div>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8, marginBottom: 10 }}>
          {ACT_CATS.map((c) => <Chip key={c.k} active={sel.includes(c.k)} onClick={() => toggleCat(c.k)}>{c.ko}</Chip>)}
        </div>

        <button onClick={() => room && autoBuild()} disabled={!room} style={{ width: "100%", border: "none", cursor: room ? "pointer" : "not-allowed", padding: "13px 0", borderRadius: 14, background: room ? grad : "#C4D2E4", color: "#fff", fontSize: 14, fontWeight: 800, boxShadow: room ? "0 6px 16px rgba(47,123,230,0.32)" : "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 4 }}>
          <Route size={16} /> Time-Fit 자동 코스 짜기
        </button>
        <div style={{ fontSize: 10.5, color: C.faint, textAlign: "center", marginBottom: 18 }}>OR-Tools 최적화 · 환승시간·이동동선 기준 자동 배치</div>

        <SectionHead title="활동 방문지" sub={room ? (sel.length ? `${sel.map((k) => CAT_META[k].ko).join(" · ")} 합침` : "카테고리를 선택하세요") : "먼저 숙소를 선택하세요"} />
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          {!room && <Card style={{ padding: 20, textAlign: "center", color: C.faint, fontSize: 12 }}>① 데이유즈 숙소를 먼저 선택하면 활동을 담을 수 있어요.</Card>}
          {room && combined.map((p) => {
            const on = inPlan(p);
            const fits = p.move * 2 + p.dur <= BUDGET;
            const ad = AD_PLACES.has(p.name);
            const m = CAT_META[p.cat]; const Icon = m.icon;
            return (
              <Card key={p.name} style={{ padding: 12, display: "flex", alignItems: "center", gap: 12, border: on ? `2px solid ${C.blue}` : `1px solid ${C.line}` }}>
                <div style={{ width: 46, height: 46, borderRadius: 12, background: p.tint, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon size={20} color="#fff" /></div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 9, fontWeight: 800, color: "#fff", background: m.col, padding: "2px 6px", borderRadius: 999 }}>{m.ko}</span>
                    {ad && <span style={{ fontSize: 9, fontWeight: 800, color: C.goldDeep, background: "#FFF3DC", border: "1px solid #F5D089", padding: "1px 6px", borderRadius: 999 }}>제휴 AD</span>}
                    <span style={{ fontSize: 14, fontWeight: 800, color: C.ink }}>{p.name}</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.faint, marginTop: 3 }}>{p.area} · 이동 {p.move}분 · 체류 {p.dur}분</div>
                  <div style={{ display: "flex", gap: 6, marginTop: 5, alignItems: "center" }}>
                    <span style={{ fontSize: 10, fontWeight: 700, color: fits ? "#2E9E5B" : C.red, background: fits ? "#E7F7EE" : "#FDECEA", padding: "2px 7px", borderRadius: 999 }}>{fits ? "환승 내 가능" : "시간 빠듯"}</span>
                    {p.price > 0 && <span style={{ fontSize: 10, color: C.sub }}>{won(p.price)}~</span>}
                  </div>
                </div>
                <button onClick={() => toggle(p)} style={{ flexShrink: 0, width: 34, height: 34, borderRadius: 999, border: "none", cursor: "pointer", background: on ? C.blue : C.tint, color: on ? "#fff" : C.blueDeep, fontSize: 18, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{on ? <Check size={18} /> : "+"}</button>
              </Card>
            );
          })}
        </div>

        <SectionHead title="내 환승 일정" sub={room ? `${plan.length}개 활동 · 총 ${Math.floor(used / 60)}시간 ${used % 60}분` : "숙소를 선택하면 일정이 생성돼요"} />
        {!room ? (
          <Card style={{ padding: 24, textAlign: "center", color: C.faint, fontSize: 13 }}>
            <Bed size={26} color={C.faint} /><div style={{ marginTop: 8 }}>데이유즈 숙소를 <b style={{ color: C.blue }}>거점</b>으로 먼저 골라주세요.</div>
          </Card>
        ) : (
          <Card style={{ padding: 16 }}>
            {steps.map((s, i) => {
              const Icon = s.icon;
              return (
                <div key={i} style={{ display: "flex", gap: 12 }}>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <div style={{ width: 26, height: 26, borderRadius: 999, background: s.col, display: "flex", alignItems: "center", justifyContent: "center" }}><Icon size={14} color="#fff" /></div>
                    {i < steps.length - 1 && <div style={{ width: 2, flex: 1, minHeight: 16, background: C.line }} />}
                  </div>
                  <div style={{ paddingBottom: i < steps.length - 1 ? 12 : 0, flex: 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.ink }}><span style={{ color: over ? C.red : C.blue, marginRight: 8 }}>{hhmm(s.t)}</span>{s.title}</div>
                      {s.name && <button onClick={() => remove(s.name)} style={{ border: "none", background: "none", cursor: "pointer", color: C.faint, fontSize: 12 }}>삭제</button>}
                    </div>
                    <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>{s.sub}</div>
                  </div>
                </div>
              );
            })}
            {over && <div style={{ marginTop: 10, background: "#FDECEA", borderRadius: 10, padding: "10px 12px", fontSize: 12, color: C.red, fontWeight: 600 }}>환승 시간을 {-remain}분 초과했어요. 장소를 줄이거나 짧은 코스로 바꿔보세요.</div>}
            <PrimaryBtn onClick={() => onBook && onBook(room)} style={{ marginTop: 16, opacity: over ? 0.6 : 1 }}>이 숙소로 예약하기 →</PrimaryBtn>
          </Card>
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 24, marginBottom: 4 }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: C.ink }}>제휴 혜택</div>
          <span style={{ fontSize: 9, fontWeight: 800, color: C.sub, background: C.line, padding: "2px 6px", borderRadius: 999 }}>AD · 광고</span>
        </div>
        <div style={{ fontSize: 11, color: C.faint, marginBottom: 12 }}>일정과 별개로 제공되는 파트너 제안이에요.</div>
        <div style={{ display: "flex", gap: 12, overflowX: "auto", paddingBottom: 8 }}>
          {PARTNERS.map((b) => {
            const Icon = b.icon;
            return (
              <div key={b.n} style={{ minWidth: 172, flexShrink: 0, border: `1px solid ${C.line}`, borderRadius: 14, padding: 12, background: "#fff" }}>
                <div style={{ height: 64, borderRadius: 10, background: b.tint, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
                  <Icon size={24} color="#fff" />
                  <span style={{ position: "absolute", top: 6, left: 6, fontSize: 9, fontWeight: 800, color: C.goldDeep, background: "#FFF3DC", border: "1px solid #F5D089", padding: "1px 6px", borderRadius: 999 }}>제휴</span>
                </div>
                <div style={{ fontSize: 13, fontWeight: 800, color: C.ink, marginTop: 8 }}>{b.n}</div>
                <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>{b.d}</div>
                <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 3, color: C.blue, fontSize: 12, fontWeight: 800 }}>혜택 보기 <ChevronRight size={13} /></div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------- shared ---------- */
function Top({ title, sub, back }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "34px 16px 14px", background: "#fff", borderBottom: `1px solid ${C.line}` }}>
      {back && <button onClick={back} style={{ border: "none", background: "none", cursor: "pointer", padding: 0 }}><ChevronLeft size={22} color={C.ink} /></button>}
      <div><div style={{ fontWeight: 800, color: C.ink, fontSize: 16 }}>{title}</div>{sub && <div style={{ fontSize: 10, color: C.faint }}>{sub}</div>}</div>
    </div>
  );
}

document.getElementById("loading").remove();
createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
