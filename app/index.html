function interpolate(str, vars) {

}

const hhmm = (m) => {

  const m = parseInt(s.slice(-2), 10);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
};
async function fetchArrival(flightId, apiLang) {

  const f = data.flights && data.flights[0];
  if (!f) return { error: "errNotFound" };
  const arriveMin = parseHHMM(f.estimatedDateTime) ?? parseHHMM(f.scheduleDateTime);
  if (arriveMin == null) return { error: "errNoArriveTime" };
  return { arriveMin, flight: f };
}

/* ---------- routing (via local proxy → 카카오모빌리티 자동차 / ODsay 대중교통 / 도보 추정) ---------- */
const AIRPORT_COORD = { lat: 37.4460, lng: 126.4522 }; // 인천국제공항 대표 좌표(카카오모빌리티 도로망에 스냅되는 지점으로 보정)
const WALK_MAX_KM = 1.2; // 이보다 가까우면 도보로 간주(직선거리 기준)
const TRANSIT_MIN_KM = 6; // 이보다 멀면 대중교통(ODsay) 우선 시도, 실패하면 자동차로 폴백
const WALK_SPEED_KMH = 4.5;

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}
async function fetchRouteMin(origin, dest) {
  const url = `${PROXY_BASE}/api/route?originLat=${origin.lat}&originLng=${origin.lng}&destLat=${dest.lat}&destLng=${dest.lng}`;
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.durationSec == null) throw new Error(data.error || `route lookup failed (${res.status})`);
  return { min: Math.max(1, Math.round(data.durationSec / 60)), path: data.path && data.path.length > 1 ? data.path : null };
}
async function fetchTransitMin(origin, dest) {
  const url = `${PROXY_BASE}/api/transit?originLat=${origin.lat}&originLng=${origin.lng}&destLat=${dest.lat}&destLng=${dest.lng}`;
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.durationMin == null) throw new Error(data.error || `transit lookup failed (${res.status})`);
  return { min: Math.max(1, Math.round(data.durationMin)), path: data.path && data.path.length > 1 ? data.path : null };
}
// 직선거리로 도보/대중교통/자동차 중 알맞은 모드를 고르고, 그 모드로 실제 이동시간을 조회한다.
// 대중교통(ODsay) 조회가 실패하면(키 없음·노선 없음 등) 조용히 자동차(카카오모빌리티)로 폴백한다.
async function fetchTravelMin(origin, dest) {
  const km = haversineKm(origin, dest);
  if (km <= WALK_MAX_KM) {
    return { min: Math.max(1, Math.round((km / WALK_SPEED_KMH) * 60)), mode: "walk" };
  }
  if (km >= TRANSIT_MIN_KM) {
    try {
      const { min, path } = await fetchTransitMin(origin, dest);
      return { min, mode: "transit", path };
    } catch {
      // ODsay 실패 시 자동차로 폴백
    }
  }
  const { min, path } = await fetchRouteMin(origin, dest);
  return { min, mode: "drive", path };
}

  }, [room]);
  const airportTravelMinRef = useRef(airportTravelMin);
  useEffect(() => { airportTravelMinRef.current = airportTravelMin; }, [airportTravelMin]);

  const [flightLookup, setFlightLookup] = useState({ status: "idle" });
  const lookupFlight = async (flightId) => {
    if (!flightId) return;
    setFlightLookup({ status: "loading" });
    const r = await fetchArrival(flightId, API_LANG[lang] || "E");
    if (r.error) setFlightLookup({ status: "error", error: r.error });
    else setFlightLookup({ status: "success", arriveMin: r.arriveMin, flight: r.flight });
  };
  const [connLookup, setConnLookup] = useState({ status: "idle" });
  const lookupDeparture = async (flightId) => {
    if (!flightId) return;
    setConnLookup({ status: "loading" });
    const r = await fetchDeparture(flightId, API_LANG[lang] || "E");
    if (r.error) setConnLookup({ status: "error", error: r.error });
    else setConnLookup({ status: "success", departMin: r.departMin, flight: r.flight });
  };
  const arriveMin = flightLookup.status === "success" ? flightLookup.arriveMin : DEFAULT_ARRIVE;
  const departMin = connLookup.status === "success" ? connLookup.departMin : null;
  // 복귀 버퍼 = 수속시간 + 게이트마감 + 숙소→공항 실이동시간(동적). 연결편이 없으면 고정 레이오버 예산으로 계산.
  const returnBufferMin = SECURITY_BUFFER_MIN + GATE_CUTOFF_MIN + airportTravelMin;
  const returnByMin = departMin != null
    ? Math.max(arriveMin + MIN_STAY, departMin - returnBufferMin)
    : arriveMin + LAYOVER_BUDGET;

  // 온보딩 이후 항공편 지연·게이트 변경을 반영하기 위한 백그라운드 재조회 + 수동 새로고침.
  // 값이 실제로 바뀌었을 때만 배너로 알려준다(조용한 실패/무변화는 그냥 무시).
  const flightLookupRef = useRef(flightLookup);
  useEffect(() => { flightLookupRef.current = flightLookup; }, [flightLookup]);
  const connLookupRef = useRef(connLookup);
  useEffect(() => { connLookupRef.current = connLookup; }, [connLookup]);
  const [notice, setNotice] = useState(null); // { key, vars } | null
  const [rechecking, setRechecking] = useState(false);
  const recheckFlights = async () => {
    setRechecking(true);
    const buf = SECURITY_BUFFER_MIN + GATE_CUTOFF_MIN + airportTravelMinRef.current;
    const prevArrive = flightLookupRef.current.status === "success" ? flightLookupRef.current.arriveMin : null;
    const prevReturnBy = (() => {
      const pa = prevArrive ?? DEFAULT_ARRIVE;
      const pd = connLookupRef.current.status === "success" ? connLookupRef.current.departMin : null;
      return pd != null ? Math.max(pa + MIN_STAY, pd - buf) : pa + LAYOVER_BUDGET;
    })();
    if (flight && flightLookupRef.current.status === "success") {
      const r = await fetchArrival(flight, API_LANG[lang] || "E");
      if (!r.error) {
        setFlightLookup({ status: "success", arriveMin: r.arriveMin, flight: r.flight });
        if (prevArrive != null && r.arriveMin !== prevArrive) {
          setNotice({ key: "flightArriveChangedNotice", vars: { old: prevArrive, new: r.arriveMin } });
        }
      }
    }
    if (connFlight && connLookupRef.current.status === "success") {
      const rc = await fetchDeparture(connFlight, API_LANG[lang] || "E");
      if (!rc.error) {
        setConnLookup({ status: "success", departMin: rc.departMin, flight: rc.flight });
        const newArrive = flightLookupRef.current.status === "success" ? flightLookupRef.current.arriveMin : DEFAULT_ARRIVE;
        const newReturnBy = Math.max(newArrive + MIN_STAY, rc.departMin - buf);
        if (newReturnBy !== prevReturnBy) {
          setNotice({ key: "flightDepartChangedNotice", vars: { old: prevReturnBy, new: newReturnBy } });
        }
      }
    }
    setRechecking(false);
  };
  useEffect(() => {
    if (screen === "onboarding") return;
    if (flightLookup.status !== "success") return;
    const id = setInterval(recheckFlights, FLIGHT_POLL_INTERVAL_MS);
    return () => clearInterval(id);
  }, [screen, flight, connFlight, lang, flightLookup.status]);

  return (
    <LangCtx.Provider value={{ code: lang }}>
      <div style={{ minHeight: "100vh", background: "#E6ECF6", display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "20px 12px", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" }}>
        <div style={{ width: 390, maxWidth: "100%", height: 800, background: C.bg, borderRadius: 34, overflow: "hidden", position: "relative", boxShadow: "0 20px 60px rgba(30,50,110,0.25)", border: "6px solid #101826" }}>
          {screen !== "onboarding" && <FlightNotice notice={notice} onDismiss={() => setNotice(null)} />}
          <div style={{ position: "absolute", inset: 0, bottom: screen === "onboarding" ? 0 : 66, overflowY: "auto" }}>
            {screen === "onboarding" && <Onboarding {...{ step, setStep, lang, setLang, cats, toggle, flight, setFlight, go: () => setScreen("home"), flightLookup, onLookup: lookupFlight, connFlight, setConnFlight, connLookup, onLookupDeparture: lookupDeparture, arriveMin, returnByMin, airportTravelMin }} />}
            {screen === "home" && <HomeScreen {...{ cats, openRoom: (r) => { setRoom(r); setScreen("booking"); }, setScreen, flight, arrive: arriveMin, returnBy: returnByMin, flightLookup, onRecheck: recheckFlights, rechecking }} />}
            {screen === "booking" && <Booking room={room} onPay={() => setScreen("confirm")} back={() => setScreen("home")} />}
            {screen === "confirm" && <Confirm room={room} back={() => setScreen("home")} />}
            {screen === "luggage" && <Luggagepage back={() => setScreen("home")} />}
            {screen === "course" && <Course cats={cats} back={() => setScreen("home")} onBook={(r) => { setRoom(r); setScreen("booking"); }} arrive={arriveMin} returnBy={returnByMin} onRecheck={recheckFlights} rechecking={rechecking} />}
            {screen === "mypage" && <MyPage lang={lang} />}
          </div>
          {screen !== "onboarding" && (
            <Nav screen={screen} setScreen={setScreen} />
          )}
        </div>
      </div>
    </LangCtx.Provider>
  );
}

const QR = () => {
  const n = 21, cells = []; let seed = 7;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const f = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    const on = f ? (x === 0 || x === 6 || y === 0 || y === 6 || (x >= 2 && x <= 4 && y >= 2 && y <= 4)) : rnd() > 0.55;
    if (on) cells.push(<rect key={`${x}-${y}`} x={x} y={y} width={1} height={1} fill={C.ink} />);
  }
  return <svg viewBox={`0 0 ${n} ${n}`} width={150} height={150} shapeRendering="crispEdges">{cells}</svg>;
};

  // 방문지 목록/자동 코스 짜기/시간 예산 계산에 합류시켜서 "브랜드를 고르면 자동으로 추천"이 실제로 동작하게 한다.
  Brand: [
    { id: "shilla-pickup", name: { ko: "CU 영종공항신도시점", en: "CU Yeongjong Airport-town", zh: "CU Yeongjong Airport-town", ja: "CU Yeongjong Airport-town", vi: "CU Yeongjong Airport-town" }, area: { ko: "운서동", en: "Unseo-dong", zh: "云西洞", ja: "雲西洞", vi: "Unseo-dong" }, move: 14, dur: 15, price: 0, tint: "#CFE0F5", coord: { lat: 37.492741023836, lng: 126.489476424142 } },
    { id: "olive-young-partner", name: { ko: "올리브영 운서점", en: "Olive Young (Unseo)", zh: "Olive Young (Unseo)", ja: "Olive Young (Unseo)", vi: "Olive Young (Unseo)" }, area: { ko: "운서동", en: "Unseo-dong", zh: "云西洞", ja: "雲西洞", vi: "Unseo-dong" }, move: 17, dur: 30, price: 0, tint: "#E8C4D6", coord: { lat: 37.49253118561955, lng: 126.49284529121837 } },
    { id: "premium-lounge-partner", name: { ko: "테르엔 영종점 힐링센터", en: "Therven Yeongjong Healing Center", zh: "Therven Yeongjong Healing Center", ja: "Therven Yeongjong Healing Center", vi: "Therven Yeongjong Healing Center" }, area: { ko: "운서동", en: "Unseo-dong", zh: "云西洞", ja: "雲西洞", vi: "Unseo-dong" }, move: 14, dur: 60, price: 0, tint: "#C7E4D6", coord: { lat: 37.4948315434582, lng: 126.492241716604 } },
  ],
};
const ALL_PLACES = Object.entries(PLACES).flatMap(([k, arr]) => arr.map((p) => ({ ...p, cat: k })));
const PREP = 20;                 // 짐 맡기기/준비

// 카카오맵 JS SDK로 공항·숙소 3곳·전체 카테고리 장소를 한 지도에 표시. 핀을 탭하면 바로 일정에 추가/제거된다.
// SDK가 아직 로드 전이거나(도메인 미등록 등) 초기화 중 오류가 나면 조용히 안내 문구로 대체한다.
function CourseMap({ room, places, plan, onToggle }) {
  const { t } = useLang();
  const elRef = useRef(null);
  const mapObj = useRef(null);
  const overlaysRef = useRef([]);
  const [error, setError] = useState(!(typeof window !== "undefined" && window.kakao && window.kakao.maps));
  const [pois, setPois] = useState([]);
  const [legs, setLegs] = useState([]); // 확정된 일정 순서를 잇는 구간별 실제 이동수단/시간

  useEffect(() => {
    if (error || !elRef.current || mapObj.current) return;
    try {
      const center = room ? room.coord : AIRPORT_COORD;
      mapObj.current = new window.kakao.maps.Map(elRef.current, {
        center: new window.kakao.maps.LatLng(center.lat, center.lng),
        level: 8,
      });
    } catch {
      setError(true);
    }
  }, [error]);

  // 숙소 주변 실제 가게(카페/음식점)를 카카오 로컬 검색으로 가져와 참고용 회색 점으로 얹는다.
  // 실패해도(키 없음 등) 지도 자체는 그대로 동작하도록 조용히 무시한다.
  useEffect(() => {
    if (!room) { setPois([]); return; }
    let cancelled = false;
    Promise.all(NEARBY_CATEGORIES.map((c) => fetchNearbyPlaces(room.coord, c).catch(() => [])))
      .then((lists) => { if (!cancelled) setPois(lists.flat()); });
    return () => { cancelled = true; };
  }, [room]);

  // 일정에 장소를 담을 때마다(공항→숙소→장소들→공항) 구간별 실제 이동수단·경로를 다시 계산해서 지도에 선으로 그린다.
  // 이건 각 구간을 실제로 잇는 경로라 위쪽 시간 예산 카드의 근사치 계산과 약간 다를 수 있다.
  useEffect(() => {
    if (!room) { setLegs([]); return; }
    const seq = [AIRPORT_COORD, room.coord, ...plan.map((p) => p.coord), AIRPORT_COORD];
    let cancelled = false;
    Promise.all(
      seq.slice(0, -1).map((from, i) =>
        fetchTravelMin(from, seq[i + 1])
          .then((r) => ({ from, to: seq[i + 1], ...r }))
          .catch(() => ({ from, to: seq[i + 1], mode: "drive", min: null }))
      )
    ).then((results) => { if (!cancelled) setLegs(results); });
    return () => { cancelled = true; };
  }, [room, plan]);

  useEffect(() => {
    if (error || !mapObj.current) return;
    try {
      overlaysRef.current.forEach((o) => o.setMap(null));
      overlaysRef.current = [];
      const map = mapObj.current;
      const pinHtml = (color, label) =>
        `<div style="width:24px;height:24px;border-radius:999px;background:${color};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">${label}</div>`;
      const addPin = (coord, html, onClick, id) => {
        const el = document.createElement("div");
        el.innerHTML = html;
        el.className = "ds-map-pin";
        if (id) el.dataset.placeId = id;
        if (onClick) { el.style.cursor = "pointer"; el.addEventListener("click", onClick); }
        const overlay = new window.kakao.maps.CustomOverlay({
          position: new window.kakao.maps.LatLng(coord.lat, coord.lng),
          content: el,
          yAnchor: 1,
        });
        overlay.setMap(map);
        overlaysRef.current.push(overlay);
      };
      const addPoiPin = (coord, name) => {
        const el = document.createElement("div");
        el.className = "ds-poi-pin";
        el.style.cssText = "position:relative;width:9px;height:9px;border-radius:999px;background:#8DA0B8;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;";
        el.title = name;
        el.addEventListener("click", () => {
          const existing = el.querySelector(".ds-poi-label");
          if (existing) { existing.remove(); return; }
          const label = document.createElement("div");
          label.className = "ds-poi-label";
          label.textContent = name;
          label.style.cssText = "position:absolute;left:13px;top:-8px;background:#153A52;color:#fff;font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);";
          el.appendChild(label);
        });
        const overlay = new window.kakao.maps.CustomOverlay({
          position: new window.kakao.maps.LatLng(coord.lat, coord.lng),
          content: el,
          yAnchor: 0.5,
          zIndex: 1,
        });
        overlay.setMap(map);
        overlaysRef.current.push(overlay);
      };
      const LEG_STYLE = {
        walk: { strokeColor: "#8DA0B8", strokeStyle: "shortdash" },
        transit: { strokeColor: "#2F7BE6", strokeStyle: "shortdot" },
        drive: { strokeColor: C.blueDeep, strokeStyle: "solid" },
      };
      legs.forEach((leg) => {
        const style = LEG_STYLE[leg.mode] || LEG_STYLE.drive;
        // 자동차 구간은 카카오모빌리티가 준 실제 도로 좌표(leg.path)를 따라 그린다 — 없으면(도보/대중교통) 직선으로 폴백.
        const points = leg.path && leg.path.length > 1 ? leg.path : [leg.from, leg.to];
        const polyline = new window.kakao.maps.Polyline({
          path: points.map((pt) => new window.kakao.maps.LatLng(pt.lat, pt.lng)),
          strokeWeight: 4,
          strokeColor: style.strokeColor,
          strokeOpacity: 0.85,
          strokeStyle: style.strokeStyle,
        });
        polyline.setMap(map);
        overlaysRef.current.push(polyline);
      });
      pois.forEach((poi) => addPoiPin({ lat: poi.lat, lng: poi.lng }, poi.name));
      addPin(AIRPORT_COORD, pinHtml(C.ink, "✈"));
      ROOMS.forEach((r) => addPin(r.coord, pinHtml(room && room.id === r.id ? C.blueDeep : C.faint, "🏨")));
      places.forEach((p) => {
        const inPlanNow = plan.some((x) => x.id === p.id);
        addPin(p.coord, pinHtml(CAT_META[p.cat].col, inPlanNow ? "✓" : "●"), () => onToggle(p), p.id);
      });
      if (room) map.setCenter(new window.kakao.maps.LatLng(room.coord.lat, room.coord.lng));
    } catch {
      setError(true);
    }
  }, [error, room, places, plan, pois, legs]);

  if (error) {
    return <Card style={{ padding: 20, textAlign: "center", color: C.faint, fontSize: 12 }}>{t("mapUnavailable")}</Card>;
  }
  return <div ref={elRef} style={{ width: "100%", height: 320, borderRadius: 14, overflow: "hidden", border: `1px solid ${C.line}` }} />;
}

function Course({ cats, back, onBook, arrive, returnBy, onRecheck, rechecking }) {
  const { t, tr, fmtTime } = useLang();
  const BUDGET = returnBy - arrive; // 분
  const initSel = (cats && cats.length) ? cats.filter((k) => k !== "Rest" && CAT_META[k]) : ["Shopping"];
  const [room, setRoom] = useState(null);
  const [sel, setSel] = useState(initSel.length ? initSel : ["Shopping"]);
  const [plan, setPlan] = useState([]);
  const [routeMin, setRouteMin] = useState({}); // id -> 실제 이동시간(분), 없으면 더미 move로 폴백
  const [routeMode, setRouteMode] = useState({}); // id -> "walk" | "transit" | "drive"
  const [routeStatus, setRouteStatus] = useState("idle"); // idle | loading | live | demo
  const inPlan = (p) => plan.some((x) => x.id === p.id);
  const toggleCat = (k) => setSel((prev) => (prev.includes(k) ? prev.filter((x) => x !== k) : [...prev, k]));
  const toggle = (p) => setPlan((prev) => (inPlan(p) ? prev.filter((x) => x.id !== p.id) : [...prev, p]));
  const remove = (id) => setPlan((prev) => prev.filter((x) => x.id !== id));
  const moveOf = (item) => routeMin[item.id] ?? item.move;

  const combined = sel.flatMap((k) => (PLACES[k] || []).map((p) => ({ ...p, cat: k })));

  // 숙소(코스 거점)를 고르면 공항→숙소, 숙소→(선택 카테고리의) 각 장소까지 직선거리 기준으로
  // 도보/대중교통(ODsay)/자동차(카카오모빌리티) 중 알맞은 모드로 실제 이동시간을 조회.
  // 실패하거나 키가 없으면 조용히 더미 move 값으로 남는다(moveOf의 ?? 폴백).
  useEffect(() => {
    if (!room) return;
    let cancelled = false;
    setRouteStatus("loading");
    Promise.all([
      fetchTravelMin(AIRPORT_COORD, room.coord).then((r) => ({ id: room.id, ...r })).catch(() => null),
      ...combined.map((p) =>
        fetchTravelMin(room.coord, p.coord).then((r) => ({ id: p.id, ...r })).catch(() => null)
      ),
    ]).then((results) => {
      if (cancelled) return;
      const nextMin = {}, nextMode = {};
      results.forEach((r) => { if (r) { nextMin[r.id] = r.min; nextMode[r.id] = r.mode; } });
      setRouteMin((prev) => ({ ...prev, ...nextMin }));
      setRouteMode((prev) => ({ ...prev, ...nextMode }));
      setRouteStatus(Object.keys(nextMin).length ? "live" : "demo");
    });
    return () => { cancelled = true; };
  }, [room, sel.join(",")]);

  const computeUsed = (arr) => {
    let c = PREP;
    if (room) c += moveOf(room) + room.rest;
    arr.forEach((p) => { c += moveOf(p) + p.dur; });
    c += arr.length ? moveOf(arr[arr.length - 1]) : (room ? moveOf(room) : 0);
    return c;
  };
  const fitsWith = (arr) => computeUsed(arr) <= BUDGET;
  const autoBuild = () => {
    const chosen = [];
    (sel.length ? sel : ACT_KEYS).forEach((k) => {
      const opts = (PLACES[k] || []).map((p) => ({ ...p, cat: k }))
        .filter((p) => !chosen.some((c) => c.id === p.id))
        .sort((a, b) => (moveOf(a) + a.dur) - (moveOf(b) + b.dur));
      const best = opts.find((p) => fitsWith([...chosen, p]));
      if (best) chosen.push(best);
    });
    setPlan(chosen);
  };

  let clock = arrive;
  const steps = [{ t: clock, title: t("courseStepArrive"), sub: t("courseStepArriveSub"), col: C.red, icon: Luggage }];
  clock += PREP;
  if (room) {
    clock += moveOf(room);
    steps.push({ t: clock, title: t("courseStepRoomCheckin", { room: tr(room.name) }), sub: t("courseStepRoomSub", { rest: room.rest, move: moveOf(room) }), col: C.blue, icon: Bed });
    clock += room.rest;
  }
  plan.forEach((p) => {
    clock += moveOf(p);
    const m = CAT_META[p.cat];
    steps.push({ t: clock, title: tr(p.name), sub: t("courseStepPlaceSub", { area: tr(p.area), dur: p.dur, move: moveOf(p) }), col: m.col, icon: m.icon, id: p.id });
    clock += p.dur;
  });
  const backMove = plan.length ? moveOf(plan[plan.length - 1]) : (room ? moveOf(room) : 0);
  clock += backMove;
  steps.push({ t: clock, title: t("courseStepReturn"), sub: t("courseStepReturnSub"), col: C.ink, icon: PlaneLanding });
  const used = clock - arrive;
  const remain = BUDGET - used;
  const over = remain < 0;

  return (
    <div>
      <Top title={t("courseTitle")} sub={t("courseSub")} back={back} />
      <div style={{ padding: 16 }}>
        <Card style={{ padding: 14, marginBottom: 14, borderLeft: `4px solid ${over ? C.red : C.blue}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <ShieldCheck size={16} color={over ? C.red : C.blue} />
              <span style={{ fontSize: 13, fontWeight: 800, color: C.ink }}>{t("layoverFree", { h: Math.floor(BUDGET / 60) })}</span>
            </div>
            <span style={{ fontSize: 12, fontWeight: 800, color: over ? C.red : "#2E9E5B" }}>{over ? t("overBudget", { min: -remain }) : t("spareBudget", { min: remain })}</span>
          </div>
          <div style={{ height: 8, background: C.line, borderRadius: 999, marginTop: 10, overflow: "hidden" }}>
            <div style={{ width: `${Math.min(100, (used / BUDGET) * 100)}%`, height: "100%", background: over ? C.red : grad }} />
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 6 }}>
            <div style={{ fontSize: 11, color: C.faint }}>{t("arriveReturnLine", { arrive: fmtTime(arrive), return: fmtTime(returnBy) })}</div>
            {onRecheck && (
              <button onClick={onRecheck} disabled={rechecking} aria-label={t("refreshFlightLabel")} style={{ border: "none", background: "none", cursor: rechecking ? "default" : "pointer", padding: 2, color: C.faint, display: "flex" }}>
                <RefreshCw size={13} className={rechecking ? "ds-spin" : ""} />
              </button>
            )}
          </div>
        </Card>

        <div style={{ fontSize: 12, fontWeight: 800, color: C.ink, marginBottom: 8 }}>{t("step1RoomTitle")} <span style={{ color: C.red, fontWeight: 700 }}>{t("step1RoomRequired")}</span></div>
        <div style={{ display: "flex", gap: 10, overflowX: "auto", paddingBottom: 6, marginBottom: 18 }}>
          {ROOMS.map((r) => {
            const on = room && room.id === r.id;
            return (
              <div key={r.id} onClick={() => setRoom(r)} style={{ minWidth: 152, cursor: "pointer", border: on ? `2px solid ${C.blue}` : `1px solid ${C.line}`, borderRadius: 14, padding: 10, background: on ? C.tint : "#fff", flexShrink: 0 }}>
                <div style={{ height: 60, borderRadius: 10, background: r.tint, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
                  <Bed size={24} color="#fff" />
                  {on && <span style={{ position: "absolute", top: 6, right: 6, width: 20, height: 20, borderRadius: 999, background: C.blue, display: "flex", alignItems: "center", justifyContent: "center" }}><Check size={13} color="#fff" /></span>}
                </div>
                <div style={{ fontSize: 13, fontWeight: 800, color: C.ink, marginTop: 8 }}>{tr(r.name)}</div>
                <div style={{ fontSize: 10.5, color: C.faint, marginTop: 2 }}>{t("airportMinAway", { n: r.distMin })} · {t("restMinLbl", { n: r.rest })}</div>
                <div style={{ fontSize: 12, fontWeight: 800, color: C.blueDeep, marginTop: 4 }}>{won(r.price)}~</div>
              </div>
            );
          })}
        </div>

        <div style={{ fontSize: 12, fontWeight: 800, color: C.ink, marginBottom: 8 }}>{t("step2CatTitle")} <span style={{ color: C.faint, fontWeight: 500 }}>{t("step2CatSub")}</span></div>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8, marginBottom: 10 }}>
          {ACT_CATS.map((c) => <Chip key={c.k} active={sel.includes(c.k)} onClick={() => toggleCat(c.k)}>{tr(CAT_LABELS[c.k])}</Chip>)}
        </div>

        <button onClick={() => room && autoBuild()} disabled={!room} style={{ width: "100%", border: "none", cursor: room ? "pointer" : "not-allowed", padding: "13px 0", borderRadius: 14, background: room ? grad : "#C4D2E4", color: "#fff", fontSize: 14, fontWeight: 800, boxShadow: room ? "0 6px 16px rgba(47,123,230,0.32)" : "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 4 }}>
          <Route size={16} /> {t("autoBuildBtn")}
        </button>
        <div style={{ fontSize: 10.5, color: C.faint, textAlign: "center", marginBottom: 4 }}>{t("autoBuildNote")}</div>
        {routeStatus === "loading" && <div style={{ fontSize: 10, color: C.faint, textAlign: "center", marginBottom: 14 }}>{t("routeLoading")}</div>}
        {routeStatus === "live" && <div style={{ fontSize: 10, color: "#2E9E5B", fontWeight: 700, textAlign: "center", marginBottom: 14 }}>{t("routeLive")}</div>}
        {routeStatus === "demo" && <div style={{ height: 14 }} />}

        <SectionHead title={t("sectionVisitPlaces")} sub={room ? (sel.length ? t("selCombined", { list: sel.map((k) => tr(CAT_LABELS[k])).join(" · ") }) : t("selChoose")) : t("selChooseRoomFirst")} />
        {room && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 10.5, color: C.faint, marginBottom: 8 }}>{t("mapAllPlacesNote")}</div>
            <CourseMap room={room} places={ALL_PLACES} plan={plan} onToggle={toggle} />
            {plan.length > 0 && <div style={{ fontSize: 10.5, color: C.faint, marginTop: 8 }}>{t("routeLegend")}</div>}
          </div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          {!room && <Card style={{ padding: 20, textAlign: "center", color: C.faint, fontSize: 12 }}>{t("roomFirstHint")}</Card>}
          {room && combined.map((p) => {
            const on = inPlan(p);
            const fits = moveOf(p) * 2 + p.dur <= BUDGET;
            const ad = AD_PLACES.has(p.id);
            const m = CAT_META[p.cat]; const Icon = m.icon;
            const ModeIcon = MODE_ICON[routeMode[p.id]];
            return (
              <Card key={p.id} style={{ padding: 12, display: "flex", alignItems: "center", gap: 12, border: on ? `2px solid ${C.blue}` : `1px solid ${C.line}` }}>
                <div style={{ width: 46, height: 46, borderRadius: 12, background: p.tint, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon size={20} color="#fff" /></div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 9, fontWeight: 800, color: "#fff", background: m.col, padding: "2px 6px", borderRadius: 999 }}>{tr(CAT_LABELS[p.cat])}</span>
                    {ad && <span style={{ fontSize: 9, fontWeight: 800, color: C.goldDeep, background: "#FFF3DC", border: "1px solid #F5D089", padding: "1px 6px", borderRadius: 999 }}>{t("adBadge")}</span>}
                    <span style={{ fontSize: 14, fontWeight: 800, color: C.ink }}>{tr(p.name)}</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.faint, marginTop: 3, display: "flex", alignItems: "center", flexWrap: "wrap", gap: 4 }}>
                    <span>{tr(p.area)} ·</span>
                    {ModeIcon && <ModeIcon size={11} />}
                    <span>{t("moveMinLbl", { n: moveOf(p) })} · {t("stayMinLbl", { n: p.dur })}</span>
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 5, alignItems: "center" }}>
                    <span style={{ fontSize: 10, fontWeight: 700, color: fits ? "#2E9E5B" : C.red, background: fits ? "#E7F7EE" : "#FDECEA", padding: "2px 7px", borderRadius: 999 }}>{fits ? t("fitsInTransit") : t("tightTime")}</span>
                    {p.price > 0 && <span style={{ fontSize: 10, color: C.sub }}>{won(p.price)}~</span>}
                  </div>
                </div>
                <button onClick={() => toggle(p)} style={{ flexShrink: 0, width: 34, height: 34, borderRadius: 999, border: "none", cursor: "pointer", background: on ? C.blue : C.tint, color: on ? "#fff" : C.blueDeep, fontSize: 18, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{on ? <Check size={18} /> : "+"}</button>
              </Card>
            );
          })}
        </div>

        <SectionHead title={t("sectionMySchedule")} sub={room ? t("scheduleSummary", { n: plan.length, h: Math.floor(used / 60), m: used % 60 }) : t("scheduleEmptyHint")} />
        {!room ? (
          <Card style={{ padding: 24, textAlign: "center", color: C.faint, fontSize: 13 }}>
            <Bed size={26} color={C.faint} /><div style={{ marginTop: 8 }}>{t("pickRoomPrefix")} <b style={{ color: C.blue }}>{t("pickRoomBold")}</b>{t("pickRoomSuffix")}</div>
          </Card>
        ) : (
          <Card style={{ padding: 16 }}>
            {steps.map((s, i) => {
              const Icon = s.icon;
              return (
                <div key={i} style={{ display: "flex", gap: 12 }}>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <div style={{ width: 26, height: 26, borderRadius: 999, background: s.col, display: "flex", alignItems: "center", justifyContent: "center" }}><Icon size={14} color="#fff" /></div>
                    {i < steps.length - 1 && <div style={{ width: 2, flex: 1, minHeight: 16, background: C.line }} />}
                  </div>
                  <div style={{ paddingBottom: i < steps.length - 1 ? 12 : 0, flex: 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.ink }}><span style={{ color: over ? C.red : C.blue, marginRight: 8 }}>{fmtTime(s.t)}</span>{s.title}</div>
                      {s.id && <button onClick={() => remove(s.id)} style={{ border: "none", background: "none", cursor: "pointer", color: C.faint, fontSize: 12 }}>{t("deleteBtn")}</button>}
                    </div>
                    <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>{s.sub}</div>
                  </div>
                </div>
              );
            })}
            {over && <div style={{ marginTop: 10, background: "#FDECEA", borderRadius: 10, padding: "10px 12px", fontSize: 12, color: C.red, fontWeight: 600 }}>{t("overBudgetWarning", { min: -remain })}</div>}
            <PrimaryBtn onClick={() => onBook && onBook(room)} style={{ marginTop: 16, opacity: over ? 0.6 : 1 }}>{t("bookThisRoomBtn")}</PrimaryBtn>
          </Card>
        )}
      </div>
    </div>
  );
}

/* ---------- shared ---------- */
function Top({ title, sub, back }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "34px 16px 14px", background: "#fff", borderBottom: `1px solid ${C.line}` }}>
      {back && <button onClick={back} style={{ border: "none", background: "none", cursor: "pointer", padding: 0 }}><ChevronLeft size={22} color={C.ink} /></button>}
      <div><div style={{ fontWeight: 800, color: C.ink, fontSize: 16 }}>{title}</div>{sub && <div style={{ fontSize: 10, color: C.faint }}>{sub}</div>}</div>
    </div>
  );
}

document.getElementById("loading").remove();
createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
